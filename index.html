<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Browse listings, place bids, and create your own auctions in this online marketplace app."
    />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.ico" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Special+Gothic+Expanded+One&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/9cf112f2f4.js"
      crossorigin="anonymous"
    ></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BidStack</title>
  </head>
  <body class="flex min-h-dvh flex-col bg-black font-sans text-white">
    <header class="border-light-grey relative border-b-[0.5px] bg-black">
      <nav class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
          <h1 class="font-heading text-neon-green text-2xl font-bold">
            <a href="/" data-link>BidStack</a>
          </h1>
          <ul class="hidden items-center gap-6 md:flex">
            <li><a href="/" class="hover:underline" data-link>Home</a></li>
            <li>
              <a href="/listings" class="hover:underline" data-link>Listings</a>
            </li>

            <li class="auth-logged-out">
              <a href="/login" class="btn hover:underline" data-link>Login</a>
            </li>

            <li class="auth-logged-in hidden">
              <a href="/profile" class="hover:underline" data-link>Profile</a>
            </li>

            <li class="auth-logged-in hidden">
              <button class="open-create-listing btn">Add listing</button>
            </li>

            <li class="auth-logged-in hidden">
              <button class="btn-secondary logout-btn" data-link>Logout</button>
            </li>
          </ul>
          <div class="flex gap-3">
            <p class="user-credits text-light-green text-right"></p>
            <button
              id="menu-btn"
              class="z-50 text-sm text-white focus:outline-none md:hidden"
            >
              <i id="menu-icon" class="fa-solid fa-bars"></i>
            </button>
          </div>
        </div>
      </nav>
      <ul
        id="menu"
        class="text-light-grey border-light-grey absolute top-full left-0 z-40 hidden w-full flex-col border-b-[0.5px] bg-black p-2 md:hidden"
      >
        <div class="pb-4 text-center">
          <li>
            <a href="/" class="block hover:underline" data-link>Home</a>
          </li>
          <li>
            <a href="/listings" class="block hover:underline" data-link
              >Listings</a
            >
          </li>
          <li>
            <a href="/profile" class="auth-logged-in hidden" data-link>
              Profile
            </a>
          </li>
        </div>
        <div class="flex flex-row justify-end gap-2">
          <button class="open-create-listing auth-logged-in btn hidden">
            Add listing
          </button>
          <div class="flex flex-row gap-2">
            <a href="/login" class="auth-logged-out btn text-white" data-link
              >Login</a
            >
            <button class="auth-logged-in btn-secondary logout-btn hidden">
              Logout
            </button>
          </div>
        </div>
      </ul>
    </header>

    <main class="flex-grow" id="app"></main>
    <footer
      class="text-light-grey border-light-grey flex justify-between border-t-[0.5px] px-4 pt-6 pb-8"
    >
      <div class="flex flex-col gap-1">
        <a href="/" data-link>Home</a>
        <a href="/profile" data-link>My profile</a>
        <a href="/listings" data-link>View all listings</a>
      </div>
      <div class="flex flex-col gap-1">
        <p>About us</p>
        <p>Contact us</p>
        <div class="flex gap-2 text-2xl">
          <i class="fa-brands fa-facebook"></i>
          <i class="fa-brands fa-square-instagram"></i>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
